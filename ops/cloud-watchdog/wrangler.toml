name = "trader-arena-cloud-watchdog"
main = "worker.mjs"
compatibility_date = "2026-11-17"
workers_dev = true

[vars]
# Activate only after the limited GitHub Actions secret has been configured.
DRY_RUN = "true"

[triggers]
# 16:55, 17:25, 18:55, 20:25 Asia/Ho_Chi_Minh; Cloudflare cron uses UTC.
crons = ["55 9,11 * * MON-FRI", "25 10,13 * * MON-FRI"]

[observability]
enabled = true
