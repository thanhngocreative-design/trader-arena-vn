name: Trader Arena VN daily paper contest
on:
  push:
    branches: [main]
    paths: ['value_investing.py', 'value_fundamentals.py', 'config/value-*.json', 'portfolio.py', 'paper_metrics.py', 'sector_analytics.py', 'config/market-classification.json', 'generate_dashboard.py', 'paper_forward.py', 'fast_engine.py', 'engine.py', '.github/workflows/daily.yml', '.gitattributes', 'state/paper_archive/**']
  workflow_dispatch:
  schedule:
    # 16:47 Vietnam time, weekdays (UTC+7).
    - cron: '47 9 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trader-arena-daily
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Reuse cached provider OHLCV database
        uses: actions/cache@v4
        with:
          path: vn_market_data.db
          key: vn-market-data-2026-${{ github.run_id }}
          restore-keys: |
            vn-market-data-2026-
      - name: Test backtesting and paper engine
        run: python -m pytest -q
      - name: Refresh Vietnamese market data and simulate bots
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python generate_dashboard.py
      - name: Refresh dated real annual statements for long-term bots
        # A failed provider refresh leaves the last verified statements in use.
        # Their real availability dates and fiscal-year freshness still apply.
        continue-on-error: true
        run: python value_fundamentals.py --refresh
      - name: Advance Buffett and Munger daily forward paper books
        run: python value_investing.py --paper
      - name: Save daily results and paper state
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Never rebase or overwrite a newer paper ledger. A different workflow
          # may have committed updated data or newer code while we were computing.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced while processing: use latest committed site/ledger"
            git reset --hard origin/main
          else
            git add state/paper_state.json state/paper_daily_gates.json site/dashboard.json state/value_paper.json site/value-investing.json state/value_daily_gates.json
            if ! git diff --cached --quiet; then
              git commit -m "Daily paper simulation results [skip ci]"
              if ! git push origin HEAD:main; then
                echo "Concurrent push detected; preserve newer remote results"
                git fetch origin main
                git reset --hard origin/main
              fi
            fi
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Send optional Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from generate_dashboard import send_telegram
          data=json.loads(Path('site/dashboard.json').read_text(encoding='utf-8'))
          try:
              print('Telegram sent:', send_telegram(data))
          except Exception as exc:
              print('Telegram delivery failed:', type(exc).__name__)
          PY
