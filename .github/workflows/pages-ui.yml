name: Publish Trader Arena iPhone UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/index.html
      - site/dashboard.json
      - site/research-146.json
      - site/live-config.json
      - site/paper-intraday.json
      - .github/workflows/pages-ui.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trader-arena-static-ui
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate publicly readable live config (no secrets)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("site/live-config.json").read_text())
          assert isinstance(obj.get("enabled"),bool)
          base=str(obj.get("api_base",""))
          assert not obj["enabled"] or base.startswith("https://")
          for token in ("DNSE_API_SECRET","DNSE_API_KEY","api_secret","api_key"):
              assert token not in obj
          print("Read-only live URL config valid")
          PY
      - name: Validate the active 146-stock research and minute coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('site/dashboard.json').read_text(encoding='utf-8'))
          snapshot=json.loads(Path('site/research-146.json').read_text(encoding='utf-8'))
          for value in (data,snapshot):
              assert value['research_meta']['revision']=='continuous146_v1'
              assert len(set(value['universe']))==146
              assert len(value['backtests'])==11
              assert value['portfolio_comparison']=={}
              for mode in ('paper','paper_minute','paper_combo','backtest','backtest_minute','hybrid'):
                  frames=value['bot_timeframes'][mode]
                  assert set(frames['bots'])==set(value['backtests'])
                  expected='minute_only' if mode in ('paper_minute','backtest_minute') else 'daily_and_minute' if mode in ('hybrid','paper_combo') else 'daily_only'
                  assert frames['counts'][expected]==11
                  assert all(b['category']==expected for b in frames['bots'].values())
              audit=value['hybrid_backtest_audit']
              if audit['status']=='verified_1m_146':
                  assert audit['symbols']==146
                  assert len(value['hybrid_backtests'])==11
                  assert set(audit['coverage_by_symbol'])==set(value['universe'])
          assert len(data['minute_backtests'])==11
          assert data['minute_backtest_audit']['symbols']==146
          assert data['minute_backtests']==snapshot['minute_backtests']
          paper=json.loads(Path('site/paper-intraday.json').read_text())
          for mode in ('paper_minute','paper_combo'):
              assert len(paper[mode])==11
          assert data['backtests']==snapshot['backtests']
          assert data['hybrid_backtests']==snapshot['hybrid_backtests']
          assert not Path('site/baseline-v1/dashboard.json').exists()
          print('Verified active research; old published backtests absent')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - uses: actions/deploy-pages@v4
        id: deploy
