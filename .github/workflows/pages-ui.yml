name: Publish Trader Arena iPhone UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/index.html
      - site/dashboard.json
      - site/research-146.json
      - site/live-config.json
      - site/paper-intraday.json
      - site/sectors.json
      - site/expansion-audit.json
      - site/value-investing.json
      - site/value-intraday.json
      - site/research-300.json
      - site/paper-replay.json
      - site/paper-fixed146.json
      - site/research-vn30.json
      - site/paper-vn30.json
      - config/research-vn30.json
      - site/pit-stocks/**
      - .github/workflows/pages-ui.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: trader-arena-static-ui
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate publicly readable live config (no secrets)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("site/live-config.json").read_text())
          assert isinstance(obj.get("enabled"),bool)
          base=str(obj.get("api_base",""))
          assert not obj["enabled"] or base.startswith("https://")
          for token in ("DNSE_API_SECRET","DNSE_API_KEY","api_secret","api_key"):
              assert token not in obj
          print("Read-only live URL config valid")
          PY
      - name: Validate the active 146-stock research and minute coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('site/dashboard.json').read_text(encoding='utf-8'))
          snapshot=json.loads(Path('site/research-146.json').read_text(encoding='utf-8'))
          for value in (data,snapshot):
              assert value['research_meta']['revision']=='continuous146_v1'
              assert len(set(value['universe']))==146
              assert len(value['backtests'])==11
              assert value['portfolio_comparison']=={}
              for mode in ('paper','paper_minute','paper_combo','backtest','backtest_minute','hybrid'):
                  frames=value['bot_timeframes'][mode]
                  assert set(frames['bots'])==set(value['backtests'])
                  expected='minute_only' if mode in ('paper_minute','backtest_minute') else 'daily_and_minute' if mode in ('hybrid','paper_combo') else 'daily_only'
                  assert frames['counts'][expected]==11
                  assert all(b['category']==expected for b in frames['bots'].values())
              audit=value['hybrid_backtest_audit']
              if audit['status']=='verified_1m_146':
                  assert audit['symbols']==146
                  assert len(value['hybrid_backtests'])==11
                  assert set(audit['coverage_by_symbol'])==set(value['universe'])
          assert len(data['minute_backtests'])==11
          assert data['minute_backtest_audit']['symbols']==146
          assert data['minute_backtests']==snapshot['minute_backtests']
          paper=json.loads(Path('site/paper-intraday.json').read_text())
          for mode in ('paper_minute','paper_combo'):
              assert len(paper[mode])==11
          assert data['backtests']==snapshot['backtests']
          assert data['hybrid_backtests']==snapshot['hybrid_backtests']
          sectors=json.loads(Path('site/sectors.json').read_text(encoding='utf-8'))
          metadata=json.loads(Path('config/market-classification.json').read_text(encoding='utf-8'))
          assert sectors['classification_asof']==metadata['asof']
          assert sum(g['count'] for g in sectors['universe'])==146
          assert {s for g in sectors['universe'] for s in g['symbols']}==set(data['universe'])
          for mode,key in [('backtest','backtests'),('backtest_minute','minute_backtests'),('hybrid','hybrid_backtests')]:
              assert len(sectors['books'][mode])==11
              for bot,stats in sectors['books'][mode].items():
                  assert stats['buy_fills']==data[key][bot]['buy_count']
                  assert stats['sell_fills']==data[key][bot]['closed_trades']
                  assert stats['outside_146_fills']==0
          assert not Path('site/baseline-v1/dashboard.json').exists()
          print('Verified active research; old published backtests absent')
          PY
      - name: Validate all six independent value simulation books
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          v=json.loads(Path('site/value-investing.json').read_text())
          assert v['revision']=='value_quality_v1' and v['mode']=='real_market_data'
          assert v['fundamentals']['sha256']==hashlib.sha256(Path('config/value-fundamentals.json').read_bytes()).hexdigest()
          for bot in ('Buffett','Munger'):
              assert set(v['traders'][bot]['supported_modes'])=={'paper_minute','paper','paper_combo','backtest_minute','backtest','hybrid'}
              assert bot in v['paper'] and bot in v['backtests']
              assert v['backtests'][bot]['sector_stats']['buy_fills']==v['backtests'][bot]['buy_count']
              assert v['backtests'][bot]['sector_stats']['sell_fills']==v['backtests'][bot]['closed_trades']
              for key in ('minute_backtests','hybrid_backtests'):
                  r=v[key][bot]
                  assert r['rules_revision']=='value_intraday_v1'
                  assert len(r['curve'])==747 and r['sector_stats']['buy_fills']==r['buy_count'] and r['sector_stats']['sell_fills']==r['closed_trades']
          paper=json.loads(Path('site/value-intraday.json').read_text())
          assert paper['revision']=='value_intraday_v1' and paper['started_at']
          for mode in ('paper_minute','paper_combo'):
              assert set(paper[mode])=={'Buffett','Munger'}
          print('Verified six value books; real minute source and independent results')
          PY
      - name: Verify rolling 300 and same-method 146 controls
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path('site/research-300.json').read_text())
          cfg=json.loads(Path('config/research-300.json').read_text())
          meta=json.loads(Path('config/market-classification.json').read_text())
          assert p['revision']=='monthly300_study_v1' and p['mode']=='real_market_data' and p['status']=='complete'
          assert p['execution_revision']=='strict_next_candle_v1'
          assert p['target']==300 and p['sessions']>=747 and len(p['months'])==37
          assert p['union_symbols']==cfg['eligible_symbols'] and p['unique_symbols']==len(p['union_symbols'])
          for row in p['months']:
              assert len(row['members'])==len(set(row['members']))==300 and row['asof']<row['effective']
              assert all(meta['listing'][s]['type']=='STOCK' for s in row['members'])
          for cohort in p['cohorts'].values():
              for key in ('backtests','minute_backtests','hybrid_backtests'):
                  assert len(cohort[key])==len(p.get('bot_ids',range(13)))
                  for b in cohort[key].values():
                      assert b['sector_stats']['buy_fills']==b['buy_count'] and b['sector_stats']['sell_fills']==b['closed_trades']
          assert p['frozen_146_snapshot_sha256']==hashlib.sha256(Path('site/research-146.json').read_bytes()).hexdigest()
          assert p['fundamentals_source_sha256']==hashlib.sha256(Path('config/value-fundamentals-300.json').read_bytes()).hexdigest()
          print('Verified 300 each month; real source stocks; both controls; paper kept separate')
          PY
      - name: Verify the shared replay protocol and all 144 paper accounts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('site/paper-replay.json').read_text())
          assert p['execution_revision']=='strict_next_candle_v1'
          assert p['revision']=='eod_replay_v1' and p['mode']=='real_market_data'
          for mode in ('paper','paper_minute','paper_combo'):
              assert set(p[mode])==set(p['bot_ids'])
          fixed=json.loads(Path('site/paper-fixed146.json').read_text())
          assert fixed['execution_revision']==p['execution_revision']
          assert fixed['last_session']==p['last_session'] and fixed['season_start']==p['season_start']
          assert fixed['target']==146 and len(set(fixed['members']))==146
          assert set(fixed['members'])==set(json.loads(Path('config/research-universe.json').read_text())['eligible_symbols'])
          for mode in ('paper','paper_minute','paper_combo'):
              assert set(fixed[mode])==set(p['bot_ids'])
          vn=json.loads(Path('site/paper-vn30.json').read_text())
          research=json.loads(Path('site/research-vn30.json').read_text())
          cfg=json.loads(Path('config/research-vn30.json').read_text())
          assert research['status']=='complete' and research['execution_revision']==p['execution_revision']
          assert research['membership_sha256']==__import__('hashlib').sha256(json.dumps(cfg,sort_keys=True,separators=(',',':'),ensure_ascii=True).encode('utf8')).hexdigest()
          assert research['sessions']==747 and research['unique_symbols']==36
          assert all(len(set(r['members']))==30 and r['asof']<r['effective'] for r in cfg['months'])
          assert vn['target']==30 and len(set(vn['members']))==30
          assert vn['last_session']==p['last_session'] and vn['season_start']==p['season_start']
          assert vn['execution_revision']==p['execution_revision']
          for mode in ('paper','paper_minute','paper_combo'):
              assert set(vn[mode])==set(p['bot_ids'])
          for key in ('backtests','minute_backtests','hybrid_backtests'):
              assert len(research['cohort'][key])==len(research.get('bot_ids',range(13)))
              for book in research['cohort'][key].values():
                  assert book['buy_count']==book['sector_stats']['buy_fills']
                  assert book['closed_trades']==book['sector_stats']['sell_fills']
          assert vn['execution_audit']['status']==research['execution_audit']['status']=='all_fills_verified_against_real_bars'
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - uses: actions/deploy-pages@v4
        id: deploy
