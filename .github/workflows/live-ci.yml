name: Trader Arena VN realtime component tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'live/**'
      - '.gitattributes'
      - 'state/paper_archive/**'
      - 'minute_arena.py'
      - 'paper_metrics.py'
      - 'sector_analytics.py'
      - 'build_sector_stats.py'
      - 'audit_market_expansion.py'
      - 'config/market-classification.json'
      - 'paper_intraday.py'
      - 'run_minute_research.py'
      - 'tests/**'
      - 'engine.py'
      - 'value_investing.py'
      - 'value_intraday.py'
      - 'pit_*.py'
      - 'collect_pit_*.py'
      - 'publish_pit.py'
      - 'config/research-300.json'
      - 'run_value_intraday.py'
      - 'value_fundamentals.py'
      - 'config/value-*.json'
      - 'site/value-investing.json'
      - 'bot_timeframes.py'
      - 'research_snapshot.py'
      - 'execution.py'
      - 'fast_engine.py'
      - 'hybrid_backtest.py'
      - 'intraday_data.py'
      - 'generate_dashboard.py'
      - 'site/index.html'
      - 'site/live-config.json'
      - 'Dockerfile.live'
      - 'requirements-live.txt'
      - '.github/workflows/live-ci.yml'
permissions:
  contents: read
jobs:
  test-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact cloud runtime dependencies and pytest
        run: python -m pip install -r requirements-live.txt -r requirements.txt pytest
      - name: Import cloud service with no broker credentials
        env:
          LIVE_DB_PATH: ${{ runner.temp }}/paper-test.sqlite
        run: python -c "from live.service import app; print('FastAPI app:',app.title)"
      - name: Test real-time ledger without any broker credentials
        run: python -m pytest -q
      - name: Confirm no order endpoint or DNSE order method
        run: |
          if grep -R -E 'place_order|send_order|submit_order' live/; then
            echo "Live component attempted to include an order-placement method"
            exit 1
          fi
          echo "Read-only paper data bridge verified"
